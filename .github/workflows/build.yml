name: Publish prebuilt Codex Desktop package

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "codex-desktop-linux branch, tag, or commit"
        required: true
        default: "main"
      max_build_threads:
        description: "Build/compression threads"
        required: true
        default: "4"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
      - "aur/arch-legacy-package.patch"
      - "aur/linux-features.json"
      - "aur/feature-policy.json"
      - "aur/feature-profile.cjs"
      - "aur/build-feature-helpers.sh"
      - "scripts/feature-profile.test.cjs"
      - "scripts/build-latest.sh"
      - "scripts/prepare-pacman-release.sh"
      - "scripts/setup-pacman-repo.sh"
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: read

concurrency:
  group: publish-prebuilt-package
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container: archlinux:base-devel

    steps:
      - name: Install CI tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm base-devel curl dpkg git github-cli gnupg nodejs npm python rust

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare unprivileged builder
        run: |
          useradd --create-home --shell /bin/bash builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Test feature omission guards
        run: node --test scripts/feature-profile.test.cjs

      - name: Build package
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref || 'main' }}
          MAX_BUILD_THREADS: ${{ inputs.max_build_threads || '4' }}
        run: |
          package_version="$(date -u +%Y.%m.%d.%H%M%S)"
          runuser -u builder -- env \
            CARGO_HOME="$GITHUB_WORKSPACE/.work/cargo-home" \
            MAX_BUILD_THREADS="$MAX_BUILD_THREADS" \
            npm_config_cache="$GITHUB_WORKSPACE/.work/npm-cache" \
            PACKAGE_VERSION="$package_version" \
            PACKAGE_WITH_UPDATER=1 \
            UPSTREAM_REF="$UPSTREAM_REF" \
            ./scripts/build-latest.sh

      - name: Upload untrusted build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-desktop-package
          path: dist/codex-desktop-[0-9]*.pkg.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: archlinux:base-devel
    permissions:
      contents: write
    env:
      RELEASE_DIR: ${{ github.workspace }}/release

    steps:
      - name: Install publishing tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm github-cli nodejs

      - name: Checkout trusted publishing code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download untrusted build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-desktop-package
          path: dist

      - name: Prepare release assets
        id: package
        env:
          PACKAGING_COMMIT: ${{ github.sha }}
          PACKAGING_REPOSITORY: ${{ github.repository }}
          UPSTREAM_REF: ${{ inputs.upstream_ref || 'main' }}
          WORKFLOW_RUN_URL: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        run: |
          mapfile -t packages < <(find dist -maxdepth 1 -type f -name 'codex-desktop-[0-9]*.pkg.tar.zst' -print)
          if [ "${#packages[@]}" -ne 1 ]; then
            printf 'Expected exactly one downloaded package, found %s\n' "${#packages[@]}" >&2
            exit 1
          fi
          ./scripts/prepare-pacman-release.sh "${packages[0]}"

      - name: Compare latest release
        id: release
        env:
          CANDIDATE_KEY: ${{ steps.package.outputs.candidate_key }}
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_dir="$RUNNER_TEMP/previous-release"
          mkdir -p "$previous_dir"
          previous_key=""
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern release-metadata.json --dir "$previous_dir" >/dev/null 2>&1; then
            previous_key="$(node -p "require('$previous_dir/release-metadata.json').candidateKey || ''")"
          fi
          if [ "$previous_key" = "$CANDIDATE_KEY" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write release notes
        if: steps.release.outputs.publish == 'true'
        run: |
          setup_script_sha256="$(sha256sum scripts/setup-pacman-repo.sh | awk '{ print $1 }')"
          cat > "$RELEASE_DIR/release-notes.md" <<'EOF'
          Prebuilt Arch/CachyOS package for **ChatGPT Community** (`codex-desktop`).

          One-time repository setup:

          ```bash
          setup_script="$(mktemp)"
          trap 'rm -f -- "$setup_script"' EXIT

          curl --fail --location --silent --show-error \
            --output "$setup_script" \
            https://raw.githubusercontent.com/JuckZ/codex-desktop-bin/__PACKAGING_COMMIT__/scripts/setup-pacman-repo.sh

          printf '%s  %s\n' \
            '__SETUP_SCRIPT_SHA256__' \
            "$setup_script" | sha256sum --check --strict

          sudo bash "$setup_script"
          ```

          Install or update:

          ```bash
          sudo pacman -Syu juckz/codex-desktop
          ```

          The package contains OpenAI application payload from the signed official Linux repository. This is an unofficial community package and is not supported or endorsed by OpenAI. `JuckZ/arch-repo` verifies this Release, signs the package with the JuckZ repository key, and publishes it to the `juckz` pacman repository.
          EOF
          sed -i \
            -e "s/__PACKAGING_COMMIT__/$GITHUB_SHA/g" \
            -e "s/__SETUP_SCRIPT_SHA256__/$setup_script_sha256/g" \
            "$RELEASE_DIR/release-notes.md"

      - name: Publish GitHub Release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_FILE: ${{ steps.package.outputs.package_file }}
          PACKAGE_VERSION: ${{ steps.package.outputs.package_version }}
        run: |
          tag="pacman-$PACKAGE_VERSION"
          gh release create "$tag" \
            "$RELEASE_DIR/$PACKAGE_FILE" \
            "$RELEASE_DIR/$PACKAGE_FILE.sha256" \
            "$RELEASE_DIR/build-info.json" \
            "$RELEASE_DIR/release-metadata.json" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "codex-desktop $PACKAGE_VERSION" \
            --notes-file "$RELEASE_DIR/release-notes.md" \
            --latest

      - name: Summary
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.package_version }}
          PUBLISH_RELEASE: ${{ steps.release.outputs.publish }}
          UPSTREAM_VERSION: ${{ steps.package.outputs.upstream_version }}
        run: |
          if [ "$PUBLISH_RELEASE" = true ]; then
            printf '### Published codex-desktop %s\n\n' "$PACKAGE_VERSION" >> "$GITHUB_STEP_SUMMARY"
            printf 'OpenAI app: `%s`\n\n' "$UPSTREAM_VERSION" >> "$GITHUB_STEP_SUMMARY"
            printf 'Install: `sudo pacman -Syu juckz/codex-desktop`\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf '### No release needed\n\nThe upstream payload and packaging source match the latest release.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
